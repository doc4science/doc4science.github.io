<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" href="media/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Samuel Grayson's Personal Website</title>
    <style>
      body {
        font-family: 'IBM Plex Mono', monospace;
        margin: 0;
        padding: 0;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 1rem;
        background-color: #5f804f;
      }

      .header img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin-right: 1rem;
        object-fit: cover;
      }

      .header .text-content {
        text-align: left;
        color: white;
        font-style: italic; /* Make text italic */
      }

      .header .text-content h1 {
        margin: 0;
        font-size: 2rem;
      }

      .header .text-content p {
        margin: 0.5rem 0 0;
        font-size: 1.2rem;
      }

      /* Ensure carousel images do not exceed vertical space and use letterboxing */
      #photoCarousel img {
        max-height: 70vh; /* Limit the height to 70% of the viewport height */
        width: 100%; /* Ensure the image spans the full width */
        object-fit: contain; /* Use letterboxing to maintain aspect ratio */
        background-color: white; /* Optional: Add a black background for letterboxing */
      }

      /* Style for black carousel arrows */
      .carousel-control-prev-icon,
      .carousel-control-next-icon {
        background-color: black; /* Set the arrow background color to black */
        border-radius: 50%; /* Optional: Make the arrows circular */
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand bg-dark navbar-dark">
      <div class="container">
        <a href="#" class="navbar-brand">SamuelGrayson.net</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a href="media/resume.pdf" class="nav-link">Resumé</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Header Section -->
    <header class="header">
      <img src="media/samuel.png" alt="Photo of Samuel Grayson">
      <div class="text-content">
        <h1>Hi there &#128075; Nice to meet you!<br> I'm <span class="text-warning">Samuel Grayson</span>...</h1>
        <p>
          ...a current second-year student at <span style="color:#4E2A84"><b>Northwestern University</b></span> studying computer engineering.
        </p>
      </div>
    </header>

    <!-- Carousel Section -->
    <div id="photoCarousel" class="carousel slide mt-4" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="media/photo1.jpeg" class="d-block w-100" alt="Photo 1">
        </div>
        <div class="carousel-item">
          <img src="media/photo2.jpeg" class="d-block w-100" alt="Photo 2">
        </div>
        <div class="carousel-item">
          <img src="media/photo3.jpeg" class="d-block w-100" alt="Photo 3">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#photoCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#photoCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
