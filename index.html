<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Samuel Grayson's Personal Wesbite</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      /* Add some basic styles for the tabbed content */
      .tab-container {
        margin-top: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        overflow: hidden;
        font-family: 'Tbc_l';
      }
      .tab {
        display: inline-block;
        padding: 10px 20px;
        cursor: pointer;
        background: #000000;
        border: 1px solid #ccc;
        border-bottom: none;
      }
      .tab.active {
        background: rgb(67, 67, 74);
        font-weight: bold;
      }
      .tab-content {
        display: none;
        padding: 20px;
        border: 1px solid #ccc;
      }
      .tab-content.active {
        display: block;
      }
      /* Style for the iframe */
      .resume-iframe {
        width: 100%;
        height: 600px; /* Adjust height as needed */
        border: none;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="left">
        <h1 class="title">Hi, I'm Samuel Grayson</h1>

        <div class="subtitle-row">
          <h2 class="subtitle subtitle-constant">and I'm a</h2>
          <h2 class="subtitle subtitle-cycle" id="cycling-text">
            junior at <span style="color:#4E2A84"><b>Northwestern University</b></span>.
          </h2>
        </div>

        <!-- Tabbed content box -->
        <div class="tab-container">
          <div class="tab active" onclick="showTab('resume')">Résumé</div>
          <div class="tab" onclick="showTab('projects')">Projects</div>
          <div class="tab" onclick="showTab('travel')">Travel Blog</div>

          <div id="resume" class="tab-content active">
            <!--<h3 class="small-ft">Resume</h3>-->
            <iframe class="resume-iframe" src="media/resume.pdf" title="Resume"></iframe>
          </div>
          <div id="projects" class="tab-content">
            <h3>Projects</h3>
            <p>View my projects here:  <a href="general.html">Projects</a></p>
          </div>
          <div id="travel" class="tab-content">
            <h3>Travel Blog</h3>
            <p>View my travel blog here:  <a href="food_travel.html">Food & Travel</a></p>
           
          </div>
        </div>
      </section>

      <aside class="right">
        <div class="floating-photos" aria-hidden="true">
          <img src="media/photo1.jpeg" alt="photo 1" class="photo p1">
          <img src="media/photo2.jpeg" alt="photo 2" class="photo p2">
          <img src="media/photo3.jpeg" alt="photo 3" class="photo p3">
          <img src="media/photo4.jpeg" alt="photo 4" class="photo p4">
          <img src="media/photo5.jpeg" alt="photo 5" class="photo p5">
          <img src="media/photo6.jpeg" alt="photo 6" class="photo p6">
        </div>
      </aside>
    </main>

    <script src="script.js" defer></script>
    <script>
      // shorter fragments — the constant "I'm a" is handled by the left element
      const sentences = [
        " junior at <span style='color:#4E2A84'><b>Northwestern University</b></span>.",
        " computer engineering major.",
        " traveler who enjoys exploring the world.",
        " retro technology enthusiast.",
        " problem-solving entrepeneur.",
      ];

      const el = document.getElementById("cycling-text");
      el.style.position = "relative";
      el.style.overflow = "hidden";
      el.style.boxSizing = "border-box";

      // preserve height so layout doesn't jump when replacing lines
      const initialHeight = el.offsetHeight || 36;
      const extra = 0; // px — tweak if needed
      el.style.minHeight = (initialHeight + extra) + "px";

      let currentIndex = 0;

      const createSpan = (html) => {
        const s = document.createElement("span");
        s.innerHTML = html;
        Object.assign(s.style, {
          display: "block",
          position: "absolute",
          left: "0",
          right: "0",
          top: "0",
          transform: "translateY(0)",
          opacity: "1",
          transition: "transform 600ms cubic-bezier(.2,.8,.2,1), opacity 600ms ease",
        });
        return s;
      };

      // start with the first fragment explicitly
      const startingHTML = sentences[0];
      let currentSpan = createSpan(startingHTML);
      el.innerHTML = "";
      el.appendChild(currentSpan);

      function showNext() {
        const nextIndex = (currentIndex + 1) % sentences.length;
        const nextSpan = createSpan(sentences[nextIndex]);
        nextSpan.style.transform = "translateY(100%)";
        nextSpan.style.opacity = "0";
        el.appendChild(nextSpan);

        requestAnimationFrame(() => {
          currentSpan.style.transform = "translateY(-100%)";
          currentSpan.style.opacity = "0";
          nextSpan.style.transform = "translateY(0)";
          nextSpan.style.opacity = "1";
        });

        setTimeout(() => {
          if (currentSpan.parentNode) el.removeChild(currentSpan);
          currentSpan = nextSpan;
          currentIndex = nextIndex;
        }, 700);
      }

      const rotateInterval = 3000;
      let timer = setInterval(showNext, rotateInterval);

      el.addEventListener("mouseenter", () => clearInterval(timer));
      el.addEventListener("mouseleave", () => {
        clearInterval(timer);
        timer = setInterval(showNext, rotateInterval);
      });

      // Tab functionality
      function showTab(tabName) {
        const tabs = document.querySelectorAll('.tab');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
          tab.classList.remove('active');
        });

        contents.forEach(content => {
          content.classList.remove('active');
        });

        document.querySelector(`.tab-content#${tabName}`).classList.add('active');
        document.querySelector(`.tab[onclick="showTab('${tabName}')"]`).classList.add('active');
      }
    </script>
    <footer>
      <p>SamuelGrayson.net</p>
      <p>42.058536, -87.674663</p>
    </footer>
  </body>
</html>
